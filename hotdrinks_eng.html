<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Hot Drinks</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
  />

  <link rel="stylesheet" href="theme.css" />
</head>

<body>
  <main class="container">
    <a href="index_eng.html" class="back-arrow">
      <i
        class="fa-solid fa-arrow-left"
        aria-hidden="true"
      ></i>
      <span>Back</span>
    </a>

    <h1>Hot Drinks</h1>

    <ul class="product-list">
      <li class="product-item header-row">
        <span class="product-name"></span>
        <span class="product-gram">price</span>
      </li>

      <li class="product-item">
        <img
          src="pic/cider.jpg"
          alt="Hot Spiced Cider"
          class="product-logo"
        />
        <span class="product-name">Hot Spiced Cider</span>
        <span class="product-price">22₪</span>
      </li>

      <li class="product-item">
        <img
          src="pic/cider.jpg"
          alt="Hot Alcoholic Cider"
          class="product-logo"
        />
        <span class="product-name">Hot Alcoholic Cider</span>
        <span class="product-price">28₪</span>
      </li>

      <li class="product-item">
        <img
          src="pic/tea.jpg"
          alt="Tea Selection"
          class="product-logo"
        />
        <span class="product-name">Tea Selection</span>
        <span class="product-price">15₪</span>
      </li>

      <li class="product-item">
        <img
          src="pic/coffee.jpg"
          alt="Black Coffee"
          class="product-logo"
        />
        <span class="product-name">Black Coffee</span>
        <span class="product-price">10₪</span>
      </li>
    </ul>
  </main>

  <!-- Image modal -->
  <div
    id="imageModal"
    class="modal"
    aria-hidden="true"
    style="display: none;"
  >
    <span
      class="close-modal"
      role="button"
      tabindex="0"
      aria-label="Close"
    >
      &times;
    </span>

    <div class="modal-box">
      <img
        class="modal-content"
        id="imgFull"
        src=""
        alt="Full image"
      />

      <div class="modal-caption">
        Image for illustration purposes only
      </div>
    </div>
  </div>

  <script>
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("imgFull");
    const closeBtn = document.querySelector(".close-modal");
    const logos = document.querySelectorAll(".product-logo");

    if (modal && modalImg && closeBtn && logos.length) {
      function openModal(image) {
        modalImg.src = image.src;
        modalImg.alt = image.alt || "Image";

        modal.style.display = "flex";
        modal.setAttribute("aria-hidden", "false");
      }

      function closeModal() {
        modal.style.display = "none";
        modal.setAttribute("aria-hidden", "true");
        modalImg.src = "";
      }

      logos.forEach((image) => {
        image.addEventListener("click", () => {
          openModal(image);
        });
      });

      closeBtn.addEventListener("click", closeModal);

      closeBtn.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          closeModal();
        }
      });

      modal.addEventListener("click", (event) => {
        if (event.target === modal) {
          closeModal();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (
          event.key === "Escape" &&
          modal.getAttribute("aria-hidden") === "false"
        ) {
          closeModal();
        }
      });
    }
  </script>

  <!-- Accessibility widget (Negishim) -->
  <script
    src="https://code.jquery.com/jquery-1.12.4.js"
    type="text/javascript"
  ></script>

  <script
    src="https://www.negishim.com/accessibility/accessibility_pro_group255.js"
    type="text/javascript"
  ></script>

  <script type="text/javascript">
    accessibility_rtl = true;
    pixel_from_side = 20;
    pixel_from_start = 20;
    css_style = 2;
  </script>
  <!-- /Accessibility widget (Negishim) -->

  <!-- PUBlic analytics -->
  <script src="analytics.js"></script>
</body>
</html>
