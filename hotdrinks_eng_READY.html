<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hot Drinks</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="theme.css" />
</head>

<body>
  <div class="container">
    <div class="topbar">
      <a href="index_eng.html" class="back-arrow"><i class="fa-solid fa-arrow-left"></i> Back</a>
      <div class="page-badge"><i class="fa-solid fa-mug-hot"></i> Public Menu</div>
    </div>

    <h1>Hot Drinks</h1>

    <ul class="product-list">
      <li class="product-item header-row">
        <span class="product-name"></span>
        <span class="product-gram">price</span>
      </li>

      <li class="product-item">
        <img src="pic/cider.jpg" alt="Hot Spiced Cider" class="product-logo" />
        <span class="product-name">Hot Spiced Cider</span>
        <span class="product-price">22₪</span>
      </li>

      <li class="product-item">
        <img src="pic/cider.jpg" alt="Hot Alcoholic Cider" class="product-logo" />
        <span class="product-name">Hot Alcoholic Cider</span>
        <span class="product-price">28₪</span>
      </li>

      <li class="product-item">
        <img src="pic/tea.jpg" alt="Tea Selection" class="product-logo" />
        <span class="product-name">Tea Selection</span>
        <span class="product-price">15₪</span>
      </li>

      <li class="product-item">
        <img src="pic/coffee.jpg" alt="Ilan Coffee" class="product-logo" />
        <span class="product-name">Ilan Coffee</span>
        <span class="product-price">10₪</span>
      </li>
    </ul>
  </div>

  <!-- Modal -->
  <div id="imageModal" class="modal" aria-hidden="true" style="display:none;">
    <span class="close-modal" aria-label="Close">&times;</span>

    <div class="modal-box">
      <img class="modal-content" id="imgFull" alt="Full image" />
      <div class="modal-caption" id="modalCaption"></div>
    </div>
  </div>

  <script>
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("imgFull");
    const closeBtn = document.querySelector(".close-modal");
    const modalCaption = document.getElementById("modalCaption");

    function openModal(img) {
      const item = img.closest(".product-item");
      const nameEl = item ? item.querySelector(".product-name") : null;
      const caption = (nameEl?.textContent || img.alt || "").trim();

      modal.style.display = "flex";
      modal.setAttribute("aria-hidden", "false");

      modalImg.src = img.src;
      modalImg.alt = img.alt || "Image";
      modalCaption.textContent = caption;

      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      modal.style.display = "none";
      modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    document.querySelectorAll(".product-logo").forEach((img) => {
      img.addEventListener("click", () => openModal(img));
    });

    closeBtn.addEventListener("click", closeModal);

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal.style.display === "flex") closeModal();
    });
  </script>

  <!-- Accessibility widget (Negishim) -->
  <script src="https://code.jquery.com/jquery-1.12.4.js" type="text/javascript"></script>
  <script src="https://www.negishim.com/accessibility/accessibility_pro_group255.js" type="text/javascript"></script>
  <script type="text/javascript">
    accessibility_rtl = false;
    pixel_from_side = 20;
    pixel_from_start = 20;
    css_style = 2;
  </script>
</body>
</html>
