<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Горячие напитки</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="theme.css" />
</head>

<body>
  <div class="container">
      <a href="index_rus.html" class="back-arrow"><i class="fa-solid fa-arrow-left"></i> Назад</a>
    <h1>Горячие напитки</h1>

    <ul class="product-list">
      <li class="product-item header-row">
        <span class="product-name"></span>
        <span class="product-gram">цена</span>
      </li>

      <li class="product-item">
        <img src="pic/cider.jpg" alt="Горячий сидр" class="product-logo" />
        <span class="product-name">Горячий сидр</span>
        <span class="product-price">22₪</span>
      </li>

      <li class="product-item">
        <img src="pic/cider.jpg" alt="Горячий алкогольный сидр" class="product-logo" />
        <span class="product-name">Горячий алкогольный сидр</span>
        <span class="product-price">28₪</span>
      </li>

      <li class="product-item">
        <img src="pic/tea.jpg" alt="Чай (ассорти)" class="product-logo" />
        <span class="product-name">Чай (ассорти)</span>
        <span class="product-price">15₪</span>
      </li>

      <li class="product-item">
        <img src="pic/coffee.jpg" alt="Черный кофе" class="product-logo" />
        <span class="product-name">Черный кофе</span>
        <span class="product-price">10₪</span>
      </li>
    </ul>
  </div>

  <!-- Modal -->
  <div id="imageModal" class="modal" aria-hidden="true">
    <span class="close-modal" role="button" tabindex="0" aria-label="Close">&times;</span>

    <div class="modal-box">
      <img class="modal-content" id="imgFull" alt="Full image" />
      <div class="modal-caption">Изображение приведено для иллюстрации</div>
    </div>
  </div>

    <script>
      const modal = document.getElementById("imageModal");
      const modalImg = document.getElementById("imgFull");
      const closeBtn = document.querySelector(".close-modal");
      const logos = document.querySelectorAll(".product-logo");

      function openModal(img) {
        modal.style.display = "flex";
        modal.setAttribute("aria-hidden", "false");
        modalImg.src = img.src;
        modalImg.alt = img.alt || "Image";
      }

      function closeModal() {
        modal.style.display = "none";
        modal.setAttribute("aria-hidden", "true");
      }

      // Тут логотипы реально есть, так что вешаем клики
      logos.forEach((img) => img.addEventListener("click", () => openModal(img)));

      closeBtn.addEventListener("click", closeModal);
      closeBtn.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") closeModal();
      });

      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.style.display === "flex") closeModal();
      });
    </script>

    <!-- Accessibility widget (Negishim) -->
    <script src="https://code.jquery.com/jquery-1.12.4.js" type="text/javascript"></script>
    <script src="https://www.negishim.com/accessibility/accessibility_pro_group255.js" type="text/javascript"></script>
    <script type="text/javascript">
      accessibility_rtl = true;
      pixel_from_side = 20;
      pixel_from_start = 20;
      css_style = 2;
    </script>
    <!-- /Accessibility widget (Negishim) -->
  </div>
</body>
</html>
