<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&display=swap" rel="stylesheet">

<body>

  <div class="container">
    <div class="topbar">
      <a href="index_eng.html" class="back-arrow"><i class="fa-solid fa-arrow-left"></i> Back</a>
      <div class="page-badge"><i class="fa-solid fa-martini-glass"></i> Public Menu</div>
    </div>

    <h1>Apperetif</h1>

    <ul class="product-list">
      <li class="product-item header-row">
        <span class="product-name"></span>
        <span class="product-gram">Chaser / Shot</span>
      </li>

      <li class="product-item">
        <span class="product-name">Martini Bianco</span>
        <span class="product-price">20₪ / 40₪</span>
      </li>

      <li class="product-item">
        <span class="product-name">Martini Rosso</span>
        <span class="product-price">20₪ / 40₪</span>
      </li>

      <li class="product-item">
        <span class="product-name">Martini Bitter</span>
        <span class="product-price">20₪ / 40₪</span>
      </li>

      <li class="product-item">
        <span class="product-name">Aperol</span>
        <span class="product-price">21₪ / 42₪</span>
      </li>

      <li class="product-item">
        <span class="product-name">Campari</span>
        <span class="product-price">21₪ / 42₪</span>
      </li>

      <li class="product-item">
        <span class="product-name">Ouzo</span>
        <span class="product-price">17₪ / 34₪</span>
      </li>

      <li class="product-item">
        <span class="product-name">Perno</span>
        <span class="product-price">19₪ / 38₪</span>
      </li>

      <li class="product-item">
        <span class="product-name">Arak</span>
        <span class="product-price">16₪ / 32₪</span>
      </li>
    </ul>
  </div>

  <div id="imageModal" class="modal">
    <span class="close-modal">&times;</span>
    <img class="modal-content" id="imgFull" alt="Full image">
  </div>

  <script>
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("imgFull");
    const closeBtn = document.querySelector(".close-modal");

    document.querySelectorAll('.product-logo').forEach(image => {
      image.addEventListener('click', () => {
        modal.style.display = "flex";
        modalImg.src = image.src;
        modalImg.alt = image.alt || "Image";
      });
    });

    closeBtn.addEventListener('click', () => modal.style.display = "none");

    modal.addEventListener('click', (event) => {
      if (event.target === modal) modal.style.display = "none";
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === "Escape" && modal.style.display === "flex") modal.style.display = "none";
    });
  </script>
